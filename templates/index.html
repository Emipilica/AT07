
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Municípios do Nordeste</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="cabecalho">
        <h1>Municípios do Nordeste</h1>
        <p>Gerenciamento de Municípios | Sistema em Flask</p>
    </header>

    <main class="container pb-4">

        <section class="row g-3 informacoes mb-4">

            <div class="col-md-3">
                <div class="info-card">
                    Região:
                    <strong>Nordeste</strong>
                </div>
            </div>

            <div class="col-md-3">
                <div class="info-card">
                    País:
                    <strong>Brasil</strong>
                </div>
            </div>

            <div class="col-md-3">
                <div class="info-card">
                    Total:
                    <strong id="total">0</strong>
                </div>
            </div>

            <div class="col-md-3">
                <div class="info-card">
                    Fonte:
                    <strong>IBGE</strong>
                </div>
            </div>

        </section>

        <div class="row g-4">

            <!-- CADASTRO -->

            <div class="col-lg-6">

                <div class="painel">

                    <div class="painel-titulo">
                        Cadastrar / Atualizar Município
                    </div>

                    <div class="painel-corpo">

                        <form id="formMunicipio">

                            <input type="hidden" id="nomeOriginal">

                            <div class="mb-3">
                                <label class="form-label">Nome do Município</label>
                                <input type="text" class="form-control"
                                       id="nome" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">ID IBGE</label>
                                <input type="number" class="form-control"
                                       id="id_ibge" required>
                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Estado</label>
                                    <input type="text" class="form-control"
                                           id="estado" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">UF</label>
                                    <input type="text" class="form-control"
                                           id="sigla_uf" maxlength="2" required>
                                </div>

                            </div>

                            <div class="mb-3">
                                <label class="form-label">População Estimada</label>
                                <input type="number" class="form-control"
                                       id="populacao" required>
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input"
                                       id="capital">
                                <label class="form-check-label">Capital?</label>
                            </div>

                            <button type="submit" class="btn btn-salvar">
                                Salvar / Atualizar
                            </button>

                            <button type="button" class="btn btn-editar"
                                    onclick="buscarPorNome()">
                                Buscar por Nome
                            </button>

                            <button type="button" class="btn btn-secondary"
                                    onclick="limparFormulario()">
                                Limpar
                            </button>

                        </form>

                    </div>
                </div>

            </div>

            <!-- LISTAGEM -->

            <div class="col-lg-6">

                <div class="painel">

                    <div class="painel-titulo">
                        Lista de Municípios
                    </div>

                    <div class="painel-corpo">

                        <div class="row g-2 mb-3">

                            <div class="col-md-7">
                                <label class="form-label">Busca</label>
                                <input type="text" id="busca"
                                       class="form-control"
                                       placeholder="Digite o município..."
                                       oninput="carregarMunicipios()">
                            </div>

                            <div class="col-md-5">
                                <label class="form-label">Filtrar por UF</label>
                                <input type="text" id="filtroUF"
                                       class="form-control"
                                       maxlength="2"
                                       placeholder="Ex: CE"
                                       oninput="carregarMunicipios()">
                            </div>

                        </div>

                        <div class="d-flex justify-content-end gap-2 mb-3">

                            <button class="btn btn-success"
                                    onclick="limparFormulario()">
                                Cadastrar Novo
                            </button>

                            <a href="/municipios/exportar"
                               class="btn btn-outline-success">
                                Baixar JSON
                            </a>

                        </div>

                        <div class="table-responsive">

                            <table class="table table-striped tabela">

                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>UF</th>
                                        <th>Capital</th>
                                        <th>População</th>
                                        <th>ID IBGE</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>

                                <tbody id="listaMunicipios"></tbody>

                            </table>

                        </div>

                        <p id="mensagemLista"
                           class="text-center text-muted"></p>

                    </div>
                </div>

            </div>

        </div>

        <footer class="rodape">
            Desenvolvido em Flask | Manipulação de Dicionários
        </footer>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
